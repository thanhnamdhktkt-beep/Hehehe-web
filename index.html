<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hehehe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安全验证</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #242b42 0%, #1a2035 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6vw 4vw 3vw;
            position: relative;
        }
        @keyframes blink1s {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .main-card {
            width: 100%;
            max-width: 320px;
            border-radius: 4px;
            overflow: visible;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            margin-top: 4vw;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }
        .top-bar {
            background: #f7c246;
            padding: 3.5vw 3vw;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            margin: 0;
            flex-shrink: 0;
            position: relative;
        }
        .top-bar p {
            text-align: center;
            color: #ffffff;
            font-size: 3.6vw;
            font-weight: 400;
            line-height: 1.6;
        }
        .top-bar::before {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            transform: translate(-50%, 50%);
            width: 14px;
            height: 14px;
            background: #242b42;
            border-radius: 50%;
            z-index: 3;
        }
        .top-bar::after {
            content: '';
            position: absolute;
            right: 0;
            bottom: 0;
            transform: translate(50%, 50%);
            width: 14px;
            height: 14px;
            background: #242b42;
            border-radius: 50%;
            z-index: 3;
        }
        .content-box {
            background: #ffffff;
            padding: 3.5vw 2vw 3vw;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }
        .qr-box {
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2.5vw 0 3vw;
        }
        .qr-box canvas, .qr-box img {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
            image-rendering: crisp-edges;
        }
        .title-top {
            color: #f9e09f;
            font-size: 5vw;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2vw;
            line-height: 1.5;
        }
        .time-text {
            color: #222222;
            font-size: 3.6vw;
            font-weight: 400;
            text-align: center;
            margin-bottom: 2.5vw;
        }
        .refresh-text {
            color: #333333;
            font-size: 3.6vw;
            font-weight: 400;
            margin-bottom: 2.5vw;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .effective-text {
            color: #22b950;
            font-size: 3.8vw;
            font-weight: 400;
            margin-bottom: 1.2vw;
            animation: blink1s 2s infinite;
        }
        .timer-text {
            color: #22b950;
            font-size: 4.5vw;
            font-weight: 400;
        }
        .note-text {
            color: #f9e09f;
            font-size: 4vw;
            font-weight: 400;
            line-height: 1.9;
            text-align: left;
            margin-top: 4vw;
            padding: 0 2vw 0 7.5vw;
            position: relative;
            z-index: 2;
            text-indent: 2em;
        }
    </style>
</head>
<body>
    <div class="title-top">V25100047(Nguyễn Văn Thành)</div>

    <div class="main-card">
        <div class="top-bar">
            <p>将二维码对准扫描器刷码出场</p>
        </div>

        <div class="content-box">
            <div id="realTime" class="time-text">Đang tải thời gian...</div>
            <div id="qrcode" class="qr-box"></div>
            <div id="refreshBtn" class="refresh-text">刷新二维码</div>
            <div class="effective-text">Effective</div>
            <div id="specialTimer" class="timer-text">25:03:20</div>
        </div>
    </div>

    <div class="note-text">
        尊敬的员工，您已进入公司保密区域，为安全起见，本设备将限制拍照功能，感谢您的配合。
    </div>

    <script>
        window.onload = function() {
            const qrContainer = document.getElementById('qrcode');

            function updateRealTime() {
                const now = new Date();
                const formatted = now.getFullYear() + "-" +
                    String(now.getMonth() + 1).padStart(2, '0') + "-" +
                    String(now.getDate()).padStart(2, '0') + " " +
                    String(now.getHours()).padStart(2, '0') + ":" +
                    String(now.getMinutes()).padStart(2, '0') + ":" +
                    String(now.getSeconds()).padStart(2, '0');
                document.getElementById('realTime').textContent = formatted;
            }
            updateRealTime();
            setInterval(updateRealTime, 1000);

            function generateNewToken() {
                const randomPart = Math.random().toString(36).substring(2, 22).toUpperCase();
                const timePart = Date.now().toString(36).toUpperCase();
                return `VERIFY-USER-V25100047-NAME-NGUYENVANTHANH-TIME-${timePart}-RND-${randomPart}-SEC-LEVEL-HIGH-AUTH-20260805`;
            }

            function generateQR() {
                const newToken = generateNewToken();
                QRCode.toCanvas(qrContainer, newToken, {
                    width: 220,
                    margin: 1,
                    errorCorrectionLevel: 'H',
                    color: { dark: "#000000", light: "#ffffff" }
                }, function(err) {
                    if (err) {
                        qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&ecc=H&data=${encodeURIComponent(newToken)}" alt="QR Code">`;
                    }
                });
            }

            generateQR();
            document.getElementById('refreshBtn').addEventListener('click', generateQR);

            // Bắt đầu đếm ngược/tăng từ 25:03:20
            let startTotal = 25 * 3600 + 3 * 60 + 20;
            const endTotal = 112 * 3600 + 22 * 60 + 11;
            function updateTimer() {
                if (startTotal > endTotal) startTotal = 25 * 3600 + 3 * 60 + 20;
                const h = Math.floor(startTotal / 3600);
                const m = Math.floor((startTotal % 3600) / 60);
                const s = startTotal % 60;
                document.getElementById('specialTimer').textContent =
                    `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                startTotal++;
            }
            updateTimer();
            setInterval(updateTimer, 1000);
        };
    </script>
</body>
</html>
